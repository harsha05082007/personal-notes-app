version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: personal_notes_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=personal_notes
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  # Express Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: personal_notes_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/personal_notes
      - JWT_SECRET=supersecretpersonalnotesjwtkey12345
    depends_on:
      mongodb:
        condition: service_healthy

  # React Vite Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: personal_notes_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data:
